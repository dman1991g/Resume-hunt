<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Daniel Graham | Interactive Resume</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- Recruiter Bypass -->
  <header id="bypass-bar">
    <button id="skipGameBtn">View Resume (Skip Game)</button>
  </header>

  <!-- Game Container -->
  <main id="game-wrapper">

    <!-- Room -->
    <section id="room">
      
      <!-- Player -->
      <div id="player" aria-label="Player character"></div>

      <!-- Interactive Objects -->
      <div class="object computer" data-action="projects" aria-label="View Projects"></div>
      <div class="object bookshelf" data-action="resume" aria-label="View Resume"></div>
      <div class="object poster" data-action="about" aria-label="About Me"></div>

    </section>

    <!-- Interaction Prompt -->
    <div id="prompt" class="hidden">
      Tap / Press Enter
    </div>

  </main>

  <!-- Mobile Controls -->
  <nav id="mobile-controls">
    <button data-dir="up">▲</button>
    <div>
      <button data-dir="left">◀</button>
      <button data-dir="down">▼</button>
      <button data-dir="right">▶</button>
    </div>
  </nav>

  <!-- Modal -->
  <div id="modal" class="hidden" role="dialog" aria-modal="true">
    <div id="modal-content"></div>
    <button id="closeModal">Close</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
